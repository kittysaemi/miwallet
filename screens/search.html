<meta charset="UTF-8">
<div id="screen-search" class="screen">
  <header class="app-header"><h1>검색</h1></header>
  <div class="content">
    <div class="search-tab-bar">
      <div class="stab active" id="stab-period" onclick="Search.setTab('period')">내역</div>
      <div class="stab" id="stab-keyword" onclick="Search.setTab('keyword')">키워드</div>
    </div>
    <div id="search-period-panel">
      <div class="tab-bar" style="margin-bottom:12px;">
        <div class="tab-item active" id="pt-daily" onclick="Search.setPeriodType('daily')">일별</div>
        <div class="tab-item" id="pt-monthly" onclick="Search.setPeriodType('monthly')">월별</div>
        <div class="tab-item" id="pt-range" onclick="Search.setPeriodType('range')">기간</div>
      </div>
      <div id="search-daily-ctrl" class="form-group"><label>날짜</label><input id="search-date" class="form-control" type="date"/></div>
      <div id="search-monthly-ctrl" class="form-group" style="display:none;"><label>월</label><input id="search-month" class="form-control" type="month"/></div>
      <div id="search-range-ctrl" style="display:none;">
        <div class="form-group"><label>시작일</label><input id="search-from" class="form-control" type="date"/></div>
        <div class="form-group"><label>종료일</label><input id="search-to" class="form-control" type="date"/></div>
      </div>
      <button class="btn btn-primary btn-full" onclick="Search.runPeriod()">조회</button>
    </div>
    <div id="search-keyword-panel" style="display:none;">
      <div class="form-group"><label>검색어</label>
        <input id="search-keyword" class="form-control" placeholder="메모 또는 카테고리명 입력" oninput="Search.runKeyword()"/></div>
    </div>
    <div id="search-results" style="margin-top:12px;"></div>
  </div>
</div>
